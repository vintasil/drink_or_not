[project]
name = "drink-or-not"
version = "0.1.0"
description = "桌面宠物:一只持剑魔法猫,定时提醒你喝水、上厕所、吃饭、休息、摸鱼,以及 18 点写日报"
requires-python = ">=3.9,<3.10"
dependencies = [
    "PyQt5>=5.15.9,<5.16",
]

[project.scripts]
drink-or-not = "drink_or_not.__main__:main"

[dependency-groups]
dev = [
    "pillow>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drink_or_not"]
